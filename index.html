canvas#fx{position:fixed;inset:0;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;max-width:480px;margin:0 auto;padding-top:env(safe-area-inset-top,0)}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 18px 6px}
.lvb{display:flex;align-items:center;gap:9px;font-weight:700;font-size:13px;color:var(--mut)}
.lvb b{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font:800 14px var(--disp);color:#3a1d02;background:linear-gradient(145deg,#ffe38a,#f2a21c);box-shadow:0 4px 14px rgba(255,159,28,.35)}
.st{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;padding:7px 13px;border-radius:99px;background:var(--panel);border:1px solid var(--edge);color:var(--mut)}

.sub{text-align:center;color:var(--mut);font-size:13px;margin-bottom:16px}

.btn.sec{background:var(--panel);color:var(--txt);box-shadow:none;border:1px solid var(--edge)}
.btn.w{width:100%}
.btn.go{min-height:58px;font-size:16px;border-radius:20px}
.btn.stop{background:rgba(255,159,28,.1);color:var(--gold);border:1px solid rgba(255,159,28,.45);box-shadow:none}
.center{text-align:center}
.lab{font-size:13px;color:var(--mut);font-weight:600}
.bal{font:800 40px var(--disp);letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.bal small{font:700 14px var(--disp);color:var(--gold);margin-left:6px}
.sub2{font-size:12.5px;color:var(--mut);margin-top:6px}
.sub2 b{color:var(--txt);font-weight:700}
.stage{position:relative;height:296px;display:grid;place-items:center;margin:4px 0 0}
.ring{position:absolute;width:290px;height:290px;transform:rotate(-90deg)}
.glow{position:absolute;width:250px;height:250px;border-radius:50%;background:radial-gradient(circle,rgba(255,170,30,.3),transparent 68%);opacity:.3;transition:opacity .6s}
.stage.on .glow{opacity:1;animation:breathe 3s ease-in-out infinite}

.scene{perspective:900px;width:190px;height:190px;cursor:pointer}
.coin3{position:relative;width:100%;height:100%;transform-style:preserve-3d;transform:rotateX(10deg) rotateY(-16deg);filter:saturate(.7) brightness(.82);transition:filter .5s}
.stage.on .coin3{filter:none;animation:spin 3.4s linear infinite}

.face.f{transform:translateZ(9px)}.face.b{transform:rotateY(180deg) translateZ(9px)}
.face:before{content:"";position:absolute;inset:14px;border-radius:50%;border:2px solid rgba(110,55,0,.45);box-shadow:inset 0 0 0 5px rgba(255,238,160,.25)}
.face b{font:800 46px var(--disp);color:#5a3103;text-shadow:0 1px 0 rgba(255,240,170,.85),0 -1px 0 rgba(90,40,0,.3);letter-spacing:-.03em}
.face:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.5) 50%,transparent 62%);transform:translateX(-100%)}
.stage.on .face:after{animation:sweep 3.4s ease-in-out infinite}
@keyframes sweep{0%,55%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.face.img:before,.face.img:after{display:none}.face.img{background:#e9b340;box-shadow:inset 0 0 0 5px #e9b340}.face.img img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}

.tick small{font:600 12px "Manrope",sans-serif;color:var(--mut);display:block;text-shadow:none;margin-top:2px}

.m{background:var(--panel);border:1px solid var(--edge);border-radius:16px;padding:11px 6px;text-align:center}

.box{background:#101014;border:1px solid var(--edge);border-radius:26px;padding:22px;width:100%;max-width:380px;max-height:85vh;overflow:auto;text-align:center}
.box h2{font:700 18px var(--disp);margin-bottom:6px}
input{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--edge);border-radius:14px;padding:13px;color:var(--txt);font:600 16px "Manrope",sans-serif;margin:6px 0;outline:0}
